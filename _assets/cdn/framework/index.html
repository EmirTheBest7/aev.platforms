<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Page Title</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" href="temp.min.css" />
    <style>
        body {
            min-height: 100vh;
            display: grid;
            padding: 1rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
                Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            color: hsl(0, 0%, 10%);
            /*background: lightblue;*/
            background: rgb(246, 248, 255);
        }

        ul li {
            margin: 16px 0;
            position: relative;
        }
    </style>
</head>

<body>
    <div class="container">
        <button class="btn-glass">Hello</button>
        <button class="btn-default">Hello</button>

        
        <ul>
            <li>
              <input id="c1" type="checkbox">
              <label for="c1">Checkbox</label>
            </li>
            <li>
              <input id="c2" type="checkbox" checked>
              <label for="c2">Checkbox</label>
            </li>
            <li>
              <input id="r1" type="radio" name="radio">
              <label for="r1">Radio</label>
            </li>
            <li>
              <input id="r2" type="radio" name="radio" checked>
              <label for="r2">Radio</label>
            </li>
            <li>
              <input id="s1" type="checkbox" class="switch">
              <label for="s1">Switch</label>
            </li>
            <li>
              <input id="s2" type="checkbox" class="switch" checked>
              <label for="s2">Switch</label>
            </li>
        </ul>
    </div>

</body>

</html>
